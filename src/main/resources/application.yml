server:
  port: 3002
  address: 0.0.0.0
  servlet:
    context-path: /bank-api

# Default in-memory user (not used while auth is disabled but kept for future)
spring.security.user.name: bankapp
spring.security.user.password: changeit

# CORS configuration
# If ALLOWED_ORIGINS env var is set, it overrides the list below (comma-separated).
# Default includes vscode internal hosts on 3002 and local dev ports.
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://vscode-internal-20390-qa.qa01.cloud.kavia.ai:3002,http://localhost:3002,http://localhost:3000,http://localhost:4000,https://vscode-internal-20390-qa.qa01.cloud.kavia.ai:3000}

# Enabling H2 Console (Boot 3)
spring:
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
      # Path defaults to /h2-console in Boot 3; SecurityFilterChain permits "/h2-console/**".
      # With the configured context-path, the full URL is /bank-api/h2-console.
  # Datasource: use explicit H2 URL to ensure stable in-memory DB across context refreshes
  # and to avoid shutdown race conditions in CI (DB_CLOSE_ON_EXIT=FALSE).
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

# Swagger UI (springdoc)
# - UI (canonical): /bank-api/swagger-ui/index.html
#   (note: /bank-api/swagger-ui.html redirects to the UI)
# - OpenAPI:   /bank-api/v3/api-docs
# H2 console:  /bank-api/h2-console (context path applied)
# SecurityFilterChain permits:
# - /v3/api-docs/**, /swagger-ui/**, /swagger-ui.html, /h2-console/**
