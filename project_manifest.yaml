name: BankApp-179898
type: backend
language: java
framework: springboot

overview:
  project_name: BankApp-179898
  description: RESTful Spring Boot banking API providing customer, account, and transaction management backed by an in-memory H2 database.
  third_party_services:
    - H2 Database
    - springdoc-openapi (swagger-ui)

env:
  TRUST_PROXY: 'true'
  LOG_LEVEL: info
  HEALTHCHECK_PATH: /bank-api/actuator/health
  FEATURE_FLAGS: '{}'
  EXPERIMENTS_ENABLED: 'false'
  BACKEND_URL: https://vscode-internal-24402-beta.beta01.cloud.kavia.ai:3002
  FRONTEND_URL: https://vscode-internal-24402-beta.beta01.cloud.kavia.ai:3000
  SITE_URL: https://vscode-internal-24402-beta.beta01.cloud.kavia.ai:3000
  ALLOWED_ORIGINS: https://vscode-internal-24402-beta.beta01.cloud.kavia.ai:3000,http://localhost:3000,http://localhost:4000
  ALLOWED_HEADERS: Content-Type,Authorization,X-Requested-With
  ALLOWED_METHODS: GET,POST,PUT,DELETE,PATCH,OPTIONS
  CORS_MAX_AGE: '3600'
  COOKIE_DOMAIN: .vscode-internal-24402-beta.beta01.cloud.kavia.ai
  HOST: 0.0.0.0
  PORT: '3002'

containers:
  - container_name: BankApp-179898
    description: Spring Boot backend for customers, accounts and transactions with H2 and OpenAPI UI.
    interfaces:
      - HTTP (REST API)
      - Swagger UI (springdoc-openapi)
    container_type: backend
    dependent_containers: []
    workspace: BankApp-179898
    container_root: BankApp-179898
    port: '3002'
    framework: springboot
    type: backend

    # Use mvn (system Maven) because mvnw is not present in this repo.
    buildCommand: mvn -q -DskipTests clean package
    startCommand: mvn spring-boot:run -Dspring-boot.run.arguments="--server.port=${PORT} --server.address=${HOST} --server.servlet.context-path=/bank-api"
    testCommand: mvn -q test
    installCommand: mvn -q -DskipTests install

    routes:
      - /bank-api
      - /bank-api/customers
      - /bank-api/accounts
      - /bank-api/transactions
      - /bank-api/transfers
      - /bank-api/v3/api-docs
      - /bank-api/swagger-ui/index.html
      - /bank-api/h2-console
      - /bank-api/healthz
      - /bank-api/actuator/health

    routes_detailed:
      - path: /bank-api/healthz
        endpoint: Liveness/health endpoint (HealthController)
      - path: /bank-api/actuator/health
        endpoint: Spring Boot Actuator health endpoint
      - path: /bank-api/swagger-ui/index.html
        endpoint: Swagger UI
      - path: /bank-api/h2-console
        endpoint: H2 database web console

    container_details:
      features:
        - CRUD operations for customers including personal and contact details management.
        - Account lifecycle and balance operations including deposits and withdrawals.
        - Internal fund transfers between a customer’s accounts with transactional integrity.
        - In-memory H2 database with web console for easy inspection during development.
        - HTTP Basic authentication using Spring Security compatible with Spring Boot 2.x (Spring Security 5). Swagger UI and H2 console are whitelisted in security config.
        - Auto-generated OpenAPI/Swagger UI via springdoc-openapi.