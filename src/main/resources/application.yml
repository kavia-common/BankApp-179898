server:
  port: ${PORT:3001}
  address: 0.0.0.0
  servlet:
    context-path: /

spring:
  security:
    user:
      name: bankapp
      password: changeit
  # Enabling H2 Console (Boot 3)
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
  # Datasource: using Boot 3 defaults (jdbc:h2:mem:testdb). Uncomment below to customize:
  # datasource:
  #   url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  #   driverClassName: org.h2.Driver
  #   username: sa
  #   password:

# Swagger UI (springdoc)
# - UI:        /swagger-ui.html or /swagger-ui/index.html
# - OpenAPI:   /v3/api-docs
# H2 console:  /h2-console
# SecurityFilterChain permits:
# - /v3/api-docs/**, /swagger-ui/**, /swagger-ui.html, /h2-console/**
