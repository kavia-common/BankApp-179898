server.port: 8989
server.servlet.context-path: /bank-api

spring.security.user.name: bankapp
spring.security.user.password: changeit

# Enabling H2 Console (Boot 3)
spring:
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
      # Path defaults to /h2-console in Boot 3; SecurityConfig permits "/h2-console/**".
      # With the configured context-path, the full URL is /bank-api/h2-console.
# Swagger UI available at /bank-api/swagger-ui.html or /bank-api/swagger-ui/index.html (springdoc-openapi)
# OpenAPI spec available at /bank-api/v3/api-docs
# H2 console reachable at /bank-api/h2-console (context path applied)
