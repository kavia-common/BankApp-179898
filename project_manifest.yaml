name: BankApp-179898
type: backend
language: java
framework: springboot

# Preview runner commands configured to use the Maven Wrapper.
# If execution permission is stripped in the environment, the runner can switch to 'sh mvnw ...'.
# Placeholders <port> and <host> will be substituted by the preview system.
preview:
  installCommand: |
    if [ -x "./mvnw" ]; then
      ./mvnw install
    else
      sh mvnw install
    fi
  buildCommand: |
    if [ -x "./mvnw" ]; then
      ./mvnw clean install
    else
      sh mvnw clean install
    fi
  testCommand: |
    if [ -x "./mvnw" ]; then
      ./mvnw test
    else
      sh mvnw test
    fi
  startCommand: |
    if [ -x "./mvnw" ]; then
      ./mvnw spring-boot:run -Dspring-boot.run.arguments="--server.port=<port> --server.address=<host>"
    else
      sh mvnw spring-boot:run -Dspring-boot.run.arguments="--server.port=<port> --server.address=<host>"
    fi

# Preserve any future fields by keeping the manifest minimal and additive.
