name: BankApp-179898
type: backend
language: java
framework: springboot

# Preview runner commands configured to use the Maven Wrapper via the ./mvn shim.
# If execution permission is stripped in the environment, the runner can switch to 'sh mvn ...'.
# Placeholders <port> and <host> will be substituted by the preview system.
preview:
  installCommand: "./mvn -q -DskipTests install || sh mvn -q -DskipTests install"
  buildCommand: "./mvn -q -DskipTests clean package || sh mvn -q -DskipTests clean package"
  testCommand: "./mvn -q test || sh mvn -q test"
  startCommand: "./mvn spring-boot:run -Dspring-boot.run.arguments=\"--server.port=<port> --server.address=<host>\" || sh mvn spring-boot:run -Dspring-boot.run.arguments=\"--server.port=<port> --server.address=<host>\""

# Preserve any future fields by keeping the manifest minimal and additive.
