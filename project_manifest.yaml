name: BankApp-179898
type: backend
language: java
framework: springboot

overview:
  project_name: BankApp-179898
  description: RESTful Spring Boot banking API for customers, accounts, and transactions using Java 21, Spring Boot 3.x, H2, and springdoc-openapi.
  third_party_services:
    - H2 Database
    - springdoc-openapi (Swagger UI)

env:
  TRUST_PROXY: 'true'
  LOG_LEVEL: info
  HEALTHCHECK_PATH: /bank-api/actuator/health
  FEATURE_FLAGS: '{}'
  EXPERIMENTS_ENABLED: 'false'
  HOST: 0.0.0.0
  PORT: '3002'
  BACKEND_URL: http://localhost:3002
  FRONTEND_URL: http://localhost:3000
  SITE_URL: http://localhost:3000
  ALLOWED_ORIGINS: http://localhost:3000,http://localhost:4000
  ALLOWED_HEADERS: Content-Type,Authorization,X-Requested-With
  ALLOWED_METHODS: GET,POST,PUT,DELETE,PATCH,OPTIONS
  CORS_MAX_AGE: '3600'

containers:
  - container_name: bankapp-backend
    description: Java 21 + Spring Boot 3.x backend for customers and accounts.
    container_type: backend
    workspace: BankApp-179898
    container_root: BankApp-179898
    port: '3002'
    framework: springboot
    type: backend

    interfaces:
      - HTTP (REST API)
      - Swagger UI (OpenAPI 3)

    # Use mvn since mvnw wrapper is not included
    buildCommand: mvn -q -DskipTests clean package
    installCommand: mvn -q -DskipTests install
    testCommand: mvn -q test
    startCommand: >
      mvn spring-boot:run
      -Dspring-boot.run.arguments="--server.port=${PORT}
      --server.address=${HOST}
      --server.servlet.context-path=/bank-api"

    routes:
      - /bank-api
      - /bank-api/customers
      - /bank-api/accounts
      - /bank-api/v3/api-docs
      - /bank-api/swagger-ui/index.html
      - /bank-api/h2-console
      - /bank-api/actuator/health

    routes_detailed:
      - path: /bank-api/v3/api-docs
        endpoint: OpenAPI JSON
      - path: /bank-api/swagger-ui/index.html
        endpoint: Swagger UI
      - path: /bank-api/h2-console
        endpoint: H2 Database Console
      - path: /bank-api/actuator/health
        endpoint: Spring Boot Health Check

    container_details:
      features:
        - Java 21 compatible Spring Boot 3 API.
        - CRUD operations for customers.
        - CRUD operations for accounts.
        - Fund transfers with transactional guarantees.
        - H2 in-memory database with web console.
        - Spring Security 6 (SecurityFilterChain).
        - Full OpenAPI 3 documentation with springdoc-openapi.